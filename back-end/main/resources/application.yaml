spring:
  application:
    name: desertrose

  datasource:
    url: "jdbc:sqlserver://localhost:1433;databaseName=DESERT_ROSE;encrypt=true;trustServerCertificate=true"
    username: sa
    password: "12345"
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.SQLServerDialect

  jackson:
    serialization:
      FAIL_ON_EMPTY_BEANS: false

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile

server:
  port: 8080